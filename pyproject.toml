[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burn-o-meter"
version = "0.3.1"
description = "An honest meter for AI coding-agent usage, cost and quota. Local-first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["claude-code", "codex", "llm", "tokens", "cost", "usage", "menu-bar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "rich>=13.0",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
# The product is "burn-o-meter". Both spellings are installed so that whichever
# form a reader copies out of the docs actually runs; `burnometer` is the one the
# docs use, because it is shorter to type.
#
# `burn` is deliberately NOT installed: it is a generic word likely to shadow
# something else on a user's PATH, and quietly taking a common command name is
# not ours to do.
burnometer = "burnometer.cli:main"
"burn-o-meter" = "burnometer.cli:main"

[project.urls]
Homepage = "https://github.com/devopsinside/burn-o-meter"
Issues = "https://github.com/devopsinside/burn-o-meter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/burnometer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
