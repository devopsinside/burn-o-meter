# Builds Homebrew bottles - prebuilt tarballs - so `brew install` needs no
# compiler. burn-o-meter is pure Python and compiles nothing, but Homebrew builds
# Python formulae from sdists with --no-binary=:all:, so without a bottle it
# demands Apple's ~1GB Command Line Tools from every user. A bottle removes that.
name: bottles

# Run this BEFORE creating the release, not after. Bottles build from the tag's
# source archive, which exists as soon as the tag is pushed — and the release must
# be created with the bottles already attached, because GitHub releases are
# immutable and assets cannot be added later. A `release: published` trigger was
# removed for that reason: it fired after the only useful moment had passed, and
# checked out the tag ref, so any formula fix made after tagging was invisible to
# it and it failed permanently.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build bottles for, e.g. v0.3.4 (push the tag first)"
        required: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  # Homebrew 6 refuses untrusted taps. This is our own formula, from this same
  # repository, built by this repository's CI - there is no third party to trust.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: arm64_tahoe (macOS 26)
          - runner: macos-15
            label: arm64_sequoia (macOS 15)
          - runner: macos-14
            label: arm64_sonoma (macOS 14)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve the tag being bottled
        id: tag
        # Through env, never spliced into the script. `${{ }}` is substituted
        # before the shell sees the text at all, so a crafted tag name would run
        # as code on a runner holding this repository's token.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${RELEASE_TAG:-$INPUT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Tap this checkout
        # Tapping the workspace bottles the formula as it exists in THIS commit,
        # rather than whatever main happens to hold.
        run: brew tap devopsinside/burn-o-meter "$GITHUB_WORKSPACE"

      - name: Build
        run: brew install --build-bottle devopsinside/burn-o-meter/burn-o-meter

      - name: Prove it runs before we ship it
        run: |
          brew test devopsinside/burn-o-meter/burn-o-meter
          burn-o-meter --version
          burn-o-meter doctor >/dev/null

      - name: Bottle
        env:
          REPOSITORY: ${{ github.repository }}
          RESOLVED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${REPOSITORY}/releases/download/${RESOLVED_TAG}" \
            devopsinside/burn-o-meter/burn-o-meter
          # brew writes `name--version.tag.bottle.tar.gz` but serves it as
          # `name-version...`; the JSON carries both names, so rename from that
          # rather than guessing at the string.
          for j in *.json; do
            jq -r '.[].bottle.tags[] | "\(.local_filename)\t\(.filename)"' "$j" |
              while IFS=$'\t' read -r src dst; do
                [ "$src" != "$dst" ] && mv -- "$src" "$dst"
              done
          done
          ls -la *.bottle.tar.gz *.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bottle-${{ matrix.runner }}
          path: |
            *.bottle.tar.gz
            *.json
          if-no-files-found: error

  collect:
    name: collect bottles
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # v8 errors on a digest mismatch instead of warning, and no longer unzips a
      # download that is not a zip. The artifacts here are multi-file uploads, which
      # are always zipped, so the second does not apply - verified by running this
      # workflow against v8 before it merged, since pull-request CI never runs it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bottle-*
          merge-multiple: true

      - name: Print the bottle block for the release
        # Deliberately does NOT attach these to the release. GitHub releases are
        # immutable once published: assets can only be added at creation time, and
        # a tag consumed by an immutable release can never be reused - so a
        # workflow that uploads afterwards cannot work, and retrying burns the
        # version number. The bottles are published as workflow artifacts instead,
        # and `scripts/release.sh` attaches them while creating the release.
        env:
          REPOSITORY: ${{ github.repository }}
          RESOLVED_TAG: ${{ steps.tag.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### Bottles built"
            echo
            echo "Download the \`bottle-*\` artifacts from this run, then create the"
            echo "release with them attached — assets cannot be added afterwards."
            echo
            echo '```ruby'
            echo '  bottle do'
            echo "    root_url \"https://github.com/${REPOSITORY}/releases/download/${RESOLVED_TAG:-$INPUT_TAG}\""
            for f in *.bottle.tar.gz; do
              tag=$(echo "$f" | sed -E 's/.*\.(arm64_[a-z]+)\.bottle\.tar\.gz/\1/')
              sum=$(shasum -a 256 "$f" | cut -d' ' -f1)
              printf '    sha256 cellar: :any_skip_relocation, %s: "%s"\n' "$tag" "$sum"
            done
            echo '  end'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
