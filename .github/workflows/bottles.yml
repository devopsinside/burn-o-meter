# Builds Homebrew bottles - prebuilt tarballs - so `brew install` needs no
# compiler. burn-o-meter is pure Python and compiles nothing, but Homebrew builds
# Python formulae from sdists with --no-binary=:all:, so without a bottle it
# demands Apple's ~1GB Command Line Tools from every user. A bottle removes that.
name: bottles

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bottle, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  # Homebrew 6 refuses untrusted taps. This is our own formula, from this same
  # repository, built by this repository's CI - there is no third party to trust.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: arm64_tahoe (macOS 26)
          - runner: macos-15
            label: arm64_sequoia (macOS 15)
          - runner: macos-14
            label: arm64_sonoma (macOS 14)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the tag being bottled
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Tap this checkout
        # Tapping the workspace bottles the formula as it exists in THIS commit,
        # rather than whatever main happens to hold.
        run: brew tap devopsinside/burn-o-meter "$GITHUB_WORKSPACE"

      - name: Build
        run: brew install --build-bottle devopsinside/burn-o-meter/burn-o-meter

      - name: Prove it runs before we ship it
        run: |
          brew test devopsinside/burn-o-meter/burn-o-meter
          burn-o-meter --version
          burn-o-meter doctor >/dev/null

      - name: Bottle
        run: |
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}" \
            devopsinside/burn-o-meter/burn-o-meter
          # brew writes `name--version.tag.bottle.tar.gz` but serves it as
          # `name-version...`; the JSON carries both names, so rename from that
          # rather than guessing at the string.
          for j in *.json; do
            jq -r '.[].bottle.tags[] | "\(.local_filename)\t\(.filename)"' "$j" |
              while IFS=$'\t' read -r src dst; do
                [ "$src" != "$dst" ] && mv -- "$src" "$dst"
              done
          done
          ls -la *.bottle.tar.gz *.json

      - uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.runner }}
          path: |
            *.bottle.tar.gz
            *.json
          if-no-files-found: error

  collect:
    name: collect bottles
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          pattern: bottle-*
          merge-multiple: true

      - name: Print the bottle block for the release
        # Deliberately does NOT attach these to the release. GitHub releases are
        # immutable once published: assets can only be added at creation time, and
        # a tag consumed by an immutable release can never be reused - so a
        # workflow that uploads afterwards cannot work, and retrying burns the
        # version number. The bottles are published as workflow artifacts instead,
        # and `scripts/release.sh` attaches them while creating the release.
        run: |
          {
            echo "### Bottles built"
            echo
            echo "Download the \`bottle-*\` artifacts from this run, then create the"
            echo "release with them attached — assets cannot be added afterwards."
            echo
            echo '```ruby'
            echo '  bottle do'
            echo "    root_url \"https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag || inputs.tag }}\""
            for f in *.bottle.tar.gz; do
              tag=$(echo "$f" | sed -E 's/.*\.(arm64_[a-z]+)\.bottle\.tar\.gz/\1/')
              sum=$(shasum -a 256 "$f" | cut -d' ' -f1)
              printf '    sha256 cellar: :any_skip_relocation, %s: "%s"\n' "$tag" "$sum"
            done
            echo '  end'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
