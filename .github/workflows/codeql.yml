name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published advisory is caught even without a commit.
    - cron: "27 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    # Code scanning needs GitHub Advanced Security, which private repositories
    # do not get on the free plan — the upload fails with "Resource not
    # accessible by integration". Skipping while private keeps the workflow
    # ready for the moment the repository goes public, without a permanently red
    # check that trains everyone to ignore failures.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # init and analyze must move together. They are separate pins, so Dependabot
      # bumps them in separate PRs - and each fails alone, because analyze refuses a
      # configuration written by a different version of init ("Loaded a
      # configuration file for version '3.38.0', but running version '4.38.0'").
      # v3 is deprecated in December 2026.
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
