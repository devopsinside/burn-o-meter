name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published advisory is caught even without a commit.
    - cron: "27 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    # Code scanning needs GitHub Advanced Security, which private repositories
    # do not get on the free plan — the upload fails with "Resource not
    # accessible by integration". Skipping while private keeps the workflow
    # ready for the moment the repository goes public, without a permanently red
    # check that trains everyone to ignore failures.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca  # v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
